<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amh · Agent 记忆管理</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--border:#2a2f3a;--text:#e6e9ef;--dim:#8b93a3;--acc:#4f8cff;--ok:#3fbf7f;--warn:#e0a53f;--bad:#e05c5c;--chip:#242936}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;font-weight:600}
header .stats{display:flex;gap:8px;margin-left:auto}
.stat{background:var(--chip);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--dim)}
.stat b{color:var(--text);margin-left:4px}
nav{display:flex;gap:4px}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
nav button.on{color:var(--text);background:var(--chip);border-color:var(--border)}
main{max-width:1100px;margin:0 auto;padding:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters input,.filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px}
.filters input{width:150px}
.filters input.q{width:220px}
button.primary{background:var(--acc);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px}
button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button.ok{background:var(--ok);color:#06280f;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
button.bad{background:var(--bad);color:#2b0808;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
th{color:var(--dim);font-weight:500;background:var(--panel2);font-size:12px}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11px;background:var(--chip);color:var(--dim)}
.badge.t-decision{color:#7ab8ff}.badge.t-gotcha{color:#ffb84f}.badge.t-preference{color:#c79bff}.badge.t-project-rule{color:#5fd4c4}.badge.t-handoff{color:#ff9bb0}.badge.t-note{color:#9aa3b2}
.badge.s-active{color:var(--ok)}.badge.s-proposed{color:var(--warn)}.badge.s-retired{color:var(--dim)}
.badge.tr-user{color:var(--ok)}.badge.tr-explicit{color:#7ab8ff}.badge.tr-extracted{color:var(--warn)}
.dim{color:var(--dim);font-size:12px}
.projcard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.projcard h3{font-size:14px;margin-bottom:8px;word-break:break-all}
.projcard .row{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.projcard .row b{color:var(--text)}
#drawer{position:fixed;top:0;right:-480px;width:460px;max-width:92vw;height:100vh;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.4);transition:right .2s;z-index:10;display:flex;flex-direction:column}
#drawer.open{right:0}
#drawer .head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
#drawer .head h2{font-size:14px;flex:1}
#drawer .body{padding:16px;overflow-y:auto;flex:1}
#drawer .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#drawer label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
#drawer textarea,#drawer input,#drawer select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font:13px/1.5 inherit;resize:vertical}
#drawer textarea{min-height:140px}
#drawer .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#overlay.open{opacity:1;pointer-events:auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;max-width:80vw}
#toast.show{opacity:1}
.empty{padding:40px;text-align:center;color:var(--dim)}
#auth-warn{display:none;padding:40px;text-align:center;color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>amh · Agent 记忆管理</h1>
  <div class="stats" id="stats"></div>
  <nav id="tabs">
    <button data-view="list" class="on">全部记忆</button>
    <button data-view="review">审批队列 <span id="qcount"></span></button>
    <button data-view="projects">项目分组</button>
    <button data-view="refresh" title="刷新数据">⟳</button>
  </nav>
</header>
<main>
  <div id="auth-warn">未授权：请通过 <code>amh ui</code> 启动时打印的带 token 地址访问本页面。</div>
  <div id="view-list">
    <div class="filters">
      <select id="f-status">
        <option value="">全部状态</option><option value="active">active</option>
        <option value="proposed">proposed</option><option value="retired">retired</option>
      </select>
      <select id="f-type">
        <option value="">全部类型</option><option>decision</option><option>gotcha</option>
        <option>preference</option><option>project-rule</option><option>handoff</option><option>note</option>
      </select>
      <input id="f-project" placeholder="项目 (project)">
      <input id="f-agent" placeholder="来源 Agent">
      <input id="f-q" class="q" placeholder="关键词搜索…">
      <button class="primary" onclick="loadList()">筛选</button>
    </div>
    <table><thead><tr><th>类型</th><th style="width:40%">内容</th><th>项目</th><th>Agent</th><th>信任</th><th>状态</th><th>时间</th></tr></thead>
    <tbody id="rows"></tbody></table>
    <div id="list-empty" class="empty" style="display:none">没有匹配的记忆</div>
  </div>
  <div id="view-review" style="display:none">
    <p class="dim" style="margin-bottom:12px">以下为抽取 worker 产生的 proposed 记忆（trust=extracted），需人工批准后才会被各 Agent 感知。批准后 trust=user。</p>
    <div id="review-cards"></div>
    <div id="review-empty" class="empty" style="display:none">审批队列为空 🎉</div>
  </div>
  <div id="view-projects" style="display:none">
    <p class="dim" style="margin-bottom:12px">按项目查看各 Agent 的记忆贡献分布（同步状态一目了然）。</p>
    <div id="project-cards"></div>
  </div>
</main>
<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="head"><h2 id="d-title">记忆详情</h2><button class="ghost" onclick="closeDrawer()">关闭</button></div>
  <div class="body">
    <div class="meta" id="d-meta"></div>
    <label>内容（content）</label><textarea id="d-content"></textarea>
    <label>项目（project）</label><input id="d-project">
    <label>类型（type）</label>
    <select id="d-type">
      <option>decision</option><option>gotcha</option><option>preference</option>
      <option>project-rule</option><option>handoff</option><option>note</option>
    </select>
    <div class="actions">
      <button class="primary" onclick="saveEdit()">保存修改</button>
      <button class="ok" id="d-approve" onclick="act('approve')">批准</button>
      <button class="ghost" id="d-reject" onclick="act('reject')">拒绝</button>
      <button class="bad" id="d-retire" onclick="act('retire')">退役</button>
      <button class="bad" id="d-delete" onclick="del()">删除</button>
    </div>
    <p class="dim" id="d-ids" style="margin-top:16px;word-break:break-all"></p>
  </div>
</div>
<div id="toast"></div>
<script>
let MEM=[];let CUR=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function api(path,opts){const r=await fetch(path,opts);if(r.status===401){$('auth-warn').style.display='block';throw new Error('unauthorized')}const j=await r.json();if(!r.ok){throw new Error(j.error||r.status)}return j}
async function refresh(){try{const st=await api('/api/stats');$('stats').innerHTML=
  `<span class="stat">总计<b>${st.total}</b></span><span class="stat">active<b>${st.by_status.active||0}</b></span>`+
  `<span class="stat">proposed<b>${st.by_status.proposed||0}</b></span><span class="stat">retired<b>${st.by_status.retired||0}</b></span>`;
  const q=st.by_status.proposed||0;$('qcount').textContent=q?`(${q})`:'';}catch(e){}
  loadList();if($('view-projects').style.display!=='none')loadProjects();}
async function loadList(){
  const p=new URLSearchParams();
  for(const[k,id]of[['status','f-status'],['type','f-type'],['project','f-project'],['agent','f-agent'],['q','f-q']]){const v=$(id).value.trim();if(v)p.set(k,v)}
  try{MEM=await api('/api/memories?'+p)}catch(e){return}
  const tb=$('rows');tb.innerHTML='';
  MEM.forEach(m=>{const tr=document.createElement('tr');tr.onclick=()=>openDrawer(m);
    tr.innerHTML=`<td><span class="badge t-${m.type}">${m.type}</span></td>`+
      `<td>${esc(m.content)}</td><td class="dim">${esc(m.project)}</td><td>${esc(m.agent)}</td>`+
      `<td><span class="badge tr-${m.trust}">${m.trust}</span></td>`+
      `<td><span class="badge s-${m.status}">${m.status}</span></td>`+
      `<td class="dim">${(m.created_at||'').slice(0,10)}</td>`;
    tb.appendChild(tr)});
  $('list-empty').style.display=MEM.length?'none':'block';
  loadReview()}
async function loadReview(){try{const ms=await api('/api/memories?status=proposed');const box=$('review-cards');box.innerHTML='';
  ms.forEach(m=>{const d=document.createElement('div');d.className='projcard';
    d.innerHTML=`<h3><span class="badge t-${m.type}">${m.type}</span> <span class="badge tr-${m.trust}">${m.trust}</span> <span class="dim">${esc(m.project)} · ${esc(m.agent)}</span></h3>`+
      `<p style="margin:8px 0">${esc(m.content)}</p>`+
      `<div style="display:flex;gap:8px"><button class="ok" onclick='openDrawerById("${m.id}",1)'>查看并批准</button>`+
      `<button class="bad" onclick='quick("${m.id}","reject")'>拒绝</button></div>`;
    box.appendChild(d)});
  $('review-empty').style.display=ms.length?'none':'block'}catch(e){}}
async function loadProjects(){try{const st=await api('/api/stats');const ms=await api('/api/memories');
  const g={};ms.forEach(m=>{(g[m.project]=g[m.project]||[]).push(m)});
  const box=$('project-cards');box.innerHTML='';
  Object.keys(g).sort().forEach(p=>{const list=g[p];const agents={};list.forEach(m=>agents[m.agent]=(agents[m.agent]||0)+1);
    const sts={};list.forEach(m=>sts[m.status]=(sts[m.status]||0)+1);
    const d=document.createElement('div');d.className='projcard';
    d.innerHTML=`<h3>${esc(p)} <span class="badge">${list.length} 条</span></h3>`+
      `<div class="row">Agent 贡献：${Object.entries(agents).map(([a,n])=>`<span><b>${esc(a)}</b> ${n}</span>`).join('')}</div>`+
      `<div class="row">状态：${Object.entries(sts).map(([s,n])=>`<span class="badge s-${s}">${s} ${n}</span>`).join('')}</div>`;
    box.appendChild(d)})}catch(e){}}
function openDrawerById(id){const m=MEM.find(x=>x.id===id)||null;if(m)openDrawer(m);else api('/api/memories/'+id).then(openDrawer)}
function openDrawer(m){CUR=m;$('d-content').value=m.content;$('d-project').value=m.project;$('d-type').value=m.type;
  $('d-meta').innerHTML=`<span class="badge t-${m.type}">${m.type}</span><span class="badge s-${m.status}">${m.status}</span><span class="badge tr-${m.trust}">trust: ${m.trust}</span>`;
  const proposed=m.status==='proposed',active=m.status==='active';
  $('d-approve').style.display=proposed?'':'none';$('d-reject').style.display=proposed?'':'none';
  $('d-retire').style.display=active?'':'none';$('d-delete').style.display=(proposed||active)?'':'none';
  const e=!(proposed||active);$('d-content').disabled=e;$('d-project').disabled=e;$('d-type').disabled=e;
  $('d-ids').textContent='id: '+m.id+' · 创建 '+m.created_at+' · 来源 '+m.agent;
  $('drawer').classList.add('open');$('overlay').classList.add('open')}
function closeDrawer(){$('drawer').classList.remove('open');$('overlay').classList.remove('open');refresh()}
async function saveEdit(){if(!CUR)return;try{await api('/api/memories/'+CUR.id,{method:'PATCH',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({content:$('d-content').value,project:$('d-project').value.trim(),type:$('d-type').value})});
  toast('已保存（Markdown 镜像已同步）')}catch(e){toast('保存失败：'+e.message)}}
async function act(name){if(!CUR)return;try{await api('/api/memories/'+CUR.id+'/'+name,{method:'POST'});toast({approve:'已批准（trust=user）',reject:'已拒绝（retired）',retire:'已退役'}[name]||name)}catch(e){toast(name+' 失败：'+e.message)}}
async function quick(id,name){try{await api('/api/memories/'+id+'/'+name,{method:'POST'});toast(name==='approve'?'已批准':'已拒绝');refresh()}catch(e){toast(name+' 失败：'+e.message)}}
async function del(){if(!CUR||!confirm('确认退役/删除这条记忆？（保留历史记录）'))return;
  try{await api('/api/memories/'+CUR.id,{method:'DELETE'});toast('已删除（retired）')}catch(e){toast('删除失败：'+e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const v=b.dataset.view;
  if(v==='refresh'){refresh();return}
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['list','review','projects'].forEach(n=>$('view-'+n).style.display=n===v?'':'none');
  if(v==='projects')loadProjects();if(v==='review')loadReview()});
refresh();
</script>
</body>
</html>
